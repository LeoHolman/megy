name: CI/CD - Deploy to staging

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AUTH_URL: https://megy.leoholman.dev
      NEXTAUTH_URL: https://megy.leoholman.dev
      AUTH_TRUST_HOST: 'true'
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      DATABASE_URL: file:./dev.db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build app
        run: npm run build

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ${{ secrets.STAGING_PATH || '/var/www/megy' }}

            git fetch origin
            git checkout main
            git pull --ff-only origin main

            npm install
            npx prisma generate
            npm run build

            if pm2 show megy > /dev/null 2>&1; then
              pm2 delete megy
            fi

            PORT=3001 NODE_ENV=production pm2 start "npm run start -- --hostname 0.0.0.0" --name megy
            pm2 save
            pm2 list
